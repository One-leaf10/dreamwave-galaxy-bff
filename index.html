<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Dreamwave Galaxy</title>
<style>
  body { margin:0; overflow:hidden; background:#02010a; }
  canvas { display:block; }
  h1 { position:absolute; top:20px; width:100%; text-align:center; color:white; font-family: sans-serif; font-weight: 800; pointer-events:none; }
  h1 span { color:#a5ff6d; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<h1>Interactive <span>Dreamwave Galaxy</span></h1>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 2.5;
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Nebula sphere (como en tu video)
const bgGeometry = new THREE.SphereGeometry(100, 32, 32);
const bgMaterial = new THREE.ShaderMaterial({
  vertexShader: `varying vec3 vPosition; void main(){ vPosition=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vPosition;
    void main(){
      float d = length(vPosition);
      vec3 color1 = vec3(0.1, 0.05, 0.3);
      vec3 color2 = vec3(0.6, 0.2, 0.8);
      vec3 color3 = vec3(0.05, 0.02, 0.15);
      float mix1 = sin(vPosition.x*0.01 + vPosition.y*0.01)*0.5+0.5;
      vec3 color = mix(color1, color2, mix1);
      color += vec3(0.2,0.1,0.4)*0.3;
      gl_FragColor = vec4(color, 1.0);
    }
  `,
  side: THREE.BackSide
});
const nebulaMesh = new THREE.Mesh(bgGeometry, bgMaterial);
scene.add(nebulaMesh);

// Stars / particles
const particleCount = 8000;
const positions = new Float32Array(particleCount*3);
const colors = new Float32Array(particleCount*3);
const sizes = new Float32Array(particleCount);
const phases = new Float32Array(particleCount);

for(let i=0;i<particleCount;i++){
  const i3 = i*3;
  // esfera aleatoria
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos(2*Math.random()-1);
  const r = 5 + Math.random()*15;
  positions[i3] = r*Math.sin(phi)*Math.cos(theta);
  positions[i3+1] = r*Math.sin(phi)*Math.sin(theta);
  positions[i3+2] = r*Math.cos(phi);

  // colores dreamwave: morado, rosa, cyan, amarillo
  const c = Math.random();
  if(c<0.33){ colors[i3]=0.7+Math.random()*0.3; colors[i3+1]=0.3+Math.random()*0.3; colors[i3+2]=1; }
  else if(c<0.66){ colors[i3]=1; colors[i3+1]=0.4+Math.random()*0.4; colors[i3+2]=0.8; }
  else { colors[i3]=0.4+Math.random()*0.6; colors[i3+1]=0.8+Math.random()*0.2; colors[i3+2]=1; }

  sizes[i] = Math.random()*4 + 0.5;
  phases[i] = Math.random()*Math.PI*2;
}

const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
starGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
starGeometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

const starMaterial = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    attribute float phase;
    varying vec3 vColor;
    varying float vPhase;
    void main(){
      vColor=color;
      vPhase=phase;
      vec4 mvPosition = modelViewMatrix * vec4(position,1.0);
      gl_PointSize = size * (400.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vPhase;
    void main(){
      float d = distance(gl_PointCoord, vec2(0.5));
      if(d>0.5) discard;
      // brillo tipo estrella cruzada
      float star = 1.0 - d*2.0;
      star = pow(star, 0.8);
      float twinkle = sin(vPhase + 3.0*0.5 + length(gl_PointCoord))*0.5+1.0;
      gl_FragColor = vec4(vColor*star*twinkle, star);
    }
  `,
  transparent:true,
  vertexColors:true,
  blending: THREE.AdditiveBlending
});

const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);

// Interactivo con mouse
let mouseX=0, mouseY=0, targetX=0, targetY=0;
document.addEventListener('mousemove', e=>{
  mouseX = (e.clientX/innerWidth -0.5)*2;
  mouseY = (e.clientY/innerHeight -0.5)*2;
});

function animate(t){
  requestAnimationFrame(animate);
  t*=0.001;
  starMaterial.uniforms = starMaterial.uniforms || {};
  // rotación suave
  targetX += (mouseX - targetX)*0.02;
  targetY += (mouseY - targetY)*0.02;
  stars.rotation.y += 0.0005 + targetX*0.01;
  stars.rotation.x += targetY*0.005;
  nebulaMesh.rotation.y -= 0.0002;

  // twinkle
  const sizesAttr = starGeometry.attributes.size;
  for(let i=0;i<particleCount;i++){
    sizesAttr.array[i] = (Math.sin(t*2+phases[i])*0.5+1.0)*(Math.random()*0.5+1.0)*2.0;
