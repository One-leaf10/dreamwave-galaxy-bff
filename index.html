<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para Jen</title>
<style>
  html,body{margin:0;padding:0;background:#07031a;overflow:hidden;height:100%}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%}
  h1{position:fixed;top:24px;left:0;width:100%;text-align:center;color:white;font-family:Arial;font-size:22px;font-weight:900;z-index:10;pointer-events:none}
  h1 span{color:#b6ff6e;display:block;font-size:18px}
  #pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);background:white;color:#1a0a3a;padding:18px 24px;border-radius:18px;font-family:Arial;font-weight:800;text-align:center;z-index:20;transition:0.3s}
  #pop.show{transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<h1>Para Jen <span>Dreamwave Galaxy</span></h1>
<div id="pop">tqm jen</div>
<canvas id="c"></canvas>
<script>
var c=document.getElementById('c');
var ctx=c.getContext('2d');
var pop=document.getElementById('pop');
var w=window.innerWidth, h=window.innerHeight;
c.width=w; c.height=h;
window.addEventListener('resize',function(){ w=window.innerWidth; h=window.innerHeight; c.width=w; c.height=h; });

var msgs=["Eres la mejor 💚","Gracias por existir ✨","Mi persona favorita 💫","Siempre cuentas conmigo 🌙","Eres magia pura 💜","tqm jen, eres lo mas importante 💚","Te quiero mucho 🫶","Eres mi estrella favorita ⭐"];
var stars=[];
var cols=['#ffeb3b','#40e0ff','#ff4edb','#7eff5c'];
for(var i=0;i<400;i++){
  stars.push({x:(Math.random()-0.5)*900, y:(Math.random()-0.5)*900, z:(Math.random()-0.5)*900, col:cols[Math.floor(Math.random()*4)], sz:Math.random()*2+1, msg:msgs[Math.floor(Math.random()*msgs.length)]});
}
var rx=0, ry=0, down=false, lx=0, ly=0, proj=[];

c.addEventListener('touchstart',function(e){ down=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY; });
c.addEventListener('touchmove',function(e){ if(!down)return; e.preventDefault(); ry+=(e.touches[0].clientX-lx)*0.005; rx+=(e.touches[0].clientY-ly)*0.005; lx=e.touches[0].clientX; ly=e.touches[0].clientY; },{passive:false});
c.addEventListener('touchend',function(e){
  down=false;
  var t=e.changedTouches[0];
  var near=null, md=70;
  for(var k=0;k<proj.length;k++){ var p=proj[k]; var d=Math.hypot(p.sx-t.clientX, p.sy-t.clientY); if(d<md){ md=d; near=p; } }
  if(near){ pop.textContent=near.msg; pop.classList.add('show'); setTimeout(function(){ pop.classList.remove('show'); },2000); }
});

  requestAnimationFrame(loop);
  ctx.fillStyle='#07031a'; ctx.fillRect(0,
