<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Interactive Dreamwave Galaxy</title>
<style>
  body{margin:0; overflow:hidden; background:#09051d; touch-action:none;}
  canvas{display:block;}
 .title{position:absolute; top:30px; width:100%; text-align:center; color:white; font-family:system-ui; font-size:32px; font-weight:800; pointer-events:none;}
 .title span{color:#b6ff6e; display:block;}
</style>
</head>
<body>
<div class="title">Interactive <span>Dreamwave Galaxy</span></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09051d);
scene.fog = new THREE.Fog(0x09051d, 8, 20);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Textura de estrella con brillo
function starTexture(){
  const c=document.createElement('canvas'); c.width=64; c.height=64;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.2,'rgba(255,255,255,0.8)');
  g.addColorStop(0.5,'rgba(255,255,255,0.2)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
  // cruz
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(32,8); ctx.lineTo(32,56); ctx.moveTo(8,32); ctx.lineTo(56,32); ctx.stroke();
  return new THREE.CanvasTexture(c);
}

const starTex = starTexture();

// Partículas
const count = 5000;
const geo = new THREE.BufferGeometry();
const pos = new Float32Array(count*3);
const col = new Float32Array(count*3);
const sizes = new Float32Array(count);

for(let i=0;i<count;i++){
  const i3=i*3;
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  const r=2+Math.random()*10;
  pos[i3]=r*Math.sin(phi)*Math.cos(theta);
  pos[i3+1]=r*Math.sin(phi)*Math.sin(theta);
  pos[i3+2]=r*Math.cos(phi);

  const t=Math.random();
  if(t<0.25){ col[i3]=1; col[i3+1]=0.9; col[i3+2]=0.3; } // amarilla
  else if(t<0.5){ col[i3]=0.3; col[i3+1]=0.8; col[i3+2]=1; } // azul
  else if(t<0.75){ col[i3]=1; col[i3+1]=0.3; col[i3+2]=0.9; } // rosa
  else { col[i3]=0.4; col[i3+1]=1; col[i3+2]=0.5; } // verde

  sizes[i]=Math.random()*0.15+0.05;
}

geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('color', new THREE.BufferAttribute(col,3));

const mat = new THREE.PointsMaterial({
  size: 0.25,
  map: starTex,
  vertexColors: true,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// Controles touch + mouse
let isDown=false, lastX=0, lastY=0, rotY=0, rotX=0, velX=0.003, velY=0;

function down(e){
  isDown=true;
  lastX = e.touches? e.touches[0].clientX : e.clientX;
  lastY = e.touches? e.touches[0].clientY : e.clientY;
}
function move(e){
  if(!isDown) return;
